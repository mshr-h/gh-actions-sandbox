name: Get TVM main SHA
on:
  workflow_dispatch:

jobs:
  get-sha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get apache/tvm main HEAD SHA
        id: tvm
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: 'apache',
              repo: 'tvm',
              ref: 'heads/main',
            });
            console.log(data);
            console.log(data.object);
            core.setOutput('sha', data.object.sha);
      - name: Print
        run: echo "TVM main SHA = ${{ steps.tvm.outputs.sha }}"
